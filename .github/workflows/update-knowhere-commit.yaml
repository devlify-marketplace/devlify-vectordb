name: Update Knowhere Commit

on:
  workflow_dispatch:
  schedule:
    - cron: '0 15 * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-knowhere-commit
  cancel-in-progress: false

jobs:
  update-knowhere-commits:
    name: update-knowhere-commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Knowhere latest commit
        id: knowhere
        shell: bash
        run: |
          set -euo pipefail
          commit=$(git ls-remote https://github.com/zilliztech/Knowhere.git refs/heads/main | awk '{print $1}')
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve Knowhere main to a full commit SHA" >&2
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Update commit pin
        env:
          KNOWHERE_COMMIT: ${{ steps.knowhere.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import re

          path = pathlib.Path('internal/core/thirdparty/knowhere/CMakeLists.txt')
          text = path.read_text()
          updated, count = re.subn(
              r'(?m)^set\(\s*KNOWHERE_VERSION\s+[0-9a-fA-F]+\s*\)\s*$',
              'set( KNOWHERE_VERSION ' + os.environ['KNOWHERE_COMMIT'] + ' )',
              text,
          )
          if count != 1:
              raise SystemExit(f'Expected exactly one Knowhere version pin, found {count}')
          path.write_text(updated)
          PY
          git diff --check
          git diff -- internal/core/thirdparty/knowhere/CMakeLists.txt

      - name: Create or update pull request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          # An optional PAT permits downstream CI; otherwise use the built-in token.
          token: ${{ secrets.ALL_CONTRIBUTORS_TOKEN || github.token }}
          commit-message: 'Update Knowhere commit'
          signoff: true
          branch: update_knowhere_commit
          delete-branch: true
          add-paths: internal/core/thirdparty/knowhere/CMakeLists.txt
          title: '[automated] Update Knowhere Commit'
          body: |
            Update Knowhere to `${{ steps.knowhere.outputs.commit }}` from upstream main.

            Review and test compatibility before merging. When the built-in GitHub
            token creates this PR, GitHub does not automatically trigger other workflows.

      - name: Report result
        env:
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
        run: |
          if [ -n "$PR_URL" ]; then
            echo "Pull request: $PR_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Knowhere pin is already current; no pull request needed." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Notify Feishu when configured
        if: steps.cpr.outputs.pull-request-url != ''
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK_KNOWHERE_COMMIT_BOT }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$FEISHU_WEBHOOK" ]; then
            echo "Feishu webhook is not configured; skipping notification."
            exit 0
          fi
          payload=$(python3 -c 'import json, os; print(json.dumps({"msg_type": "text", "content": {"text": "Knowhere update PR: " + os.environ["PR_URL"]}}))')
          curl --fail --silent --show-error --max-time 30 \
            -H 'Content-Type: application/json' --data "$payload" "$FEISHU_WEBHOOK"
